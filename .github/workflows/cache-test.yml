name: Cache Test

on:
  workflow_dispatch:

jobs:
  cache-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: create-folder
        run: mkdir -p cache-dir

      - name: cache
        id: cache
        uses: actions/cache@v4
        with:
          path: cache-dir
          key: cache-326a757

      - name: prime-cache-326a757
        run: echo "Cache hit is ${{ steps.cache.outputs.cache-hit }}"
